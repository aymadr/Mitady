<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mitady · trouve ton alternance ou ton stage</title>
  <script>
    // Applied before first paint so the page never flashes the wrong theme.
    try {
      var t = localStorage.getItem('mitady.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#f4f1e8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mitady">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="#/"><span class="brand-mark" id="brand-logo"></span><span class="brand-name">Mitady</span></a>
      <nav class="nav-links" aria-label="Navigation principale">
        <a href="#/"><svg class="nav-ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span class="lbl-full">Aujourd'hui</span><span class="lbl-short">Accueil</span></a>
        <a href="#/offres"><svg class="nav-ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3 13h18"/></svg><span>Offres</span></a>
        <a href="#/suivi"><svg class="nav-ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.6"/><rect x="9.5" y="4" width="5" height="10" rx="1.6"/><rect x="16" y="4" width="5" height="13" rx="1.6"/></svg><span>Suivi</span></a>
        <a href="#/cv"><svg class="nav-ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5M9 13h6M9 17h6M9 9.5h2"/></svg><span>CV</span></a>
        <a href="#/profil"><svg class="nav-ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg><span>Profil</span></a>
        <a href="#/reglages"><svg class="nav-ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg><span>Réglages</span></a>
      </nav>
      <button class="guide-btn" id="guide-btn" aria-label="Ouvrir le guide" title="Guide">?</button>
      <span id="theme-slot"></span>
      <a class="nav-avatar" id="nav-avatar" href="#/profil" aria-label="Ton profil"></a>
      <button class="btn btn-primary btn-sm" id="search-btn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
        <span>Chercher<span class="label-long"> des offres</span></span>
      </button>
    </div>
  </header>

  <main id="view"></main>
  <footer class="forest" id="forest" aria-hidden="true"></footer>

  <div id="sheet-root"></div>
  <div id="modal-root"></div>

  <div class="activity" id="activity" hidden>
    <div class="row">
      <span class="spinner" style="color: var(--accent)"></span>
      <strong class="grow" id="activity-title">Recherche en cours</strong>
      <button class="btn btn-plain small" id="activity-stop">Arrêter</button>
    </div>
    <div class="activity-log" id="activity-log"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/boot.js"></script>
</body>
</html>
